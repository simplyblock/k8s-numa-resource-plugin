# Builds the image on every pull request, pushes it to Quay as pr-<number>-<sha>,
# and runs Red Hat's preflight checks on it, so a change that would fail
# certification fails here. The tag never collides with a release tag or latest.
#
# Requires the QUAY_USERNAME and QUAY_PASSWORD repository secrets.
name: "Preflight"

on:
  pull_request:

permissions:
  contents: read

env:
  IMAGE: quay.io/simplyblock-io/numa-resource-plugin

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Compute tag
        id: tag
        env:
          SHA: ${{ github.event.pull_request.head.sha }}
        run: echo "tag=pr-${{ github.event.pull_request.number }}-${SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Log in to Quay.io
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build and push
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
          build-args: |
            VERSION=${{ steps.tag.outputs.tag }}

      - name: Run Red Hat preflight container checks
        run: hack/preflight.sh "${IMAGE}@${{ steps.build.outputs.digest }}"
