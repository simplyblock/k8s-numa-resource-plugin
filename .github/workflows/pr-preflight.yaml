# Builds the image on every pull request and runs Red Hat's preflight checks on
# it, so a change that would fail certification fails here. The image goes to
# ttl.sh, an anonymous registry that drops it after an hour; nothing is pushed
# to a real registry.
name: "Preflight"

on:
  pull_request:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build and push to ttl.sh
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ttl.sh/numa-resource-plugin-${{ github.sha }}:1h
          build-args: |
            VERSION=pr-${{ github.event.pull_request.number }}

      - name: Run Red Hat preflight container checks
        run: hack/preflight.sh "ttl.sh/numa-resource-plugin-${{ github.sha }}@${{ steps.build.outputs.digest }}"
