# Builds the multi-arch image and pushes it to Quay, then runs Red Hat's
# preflight checks on the pushed digest. A version tag (v1.2.3) publishes that
# version; a push to main publishes the commit SHA.
#
# :latest is not pushed. The operator deploys :latest without runAsUser, and
# this image runs as a non-root user, which cannot create the plugin socket in
# kubelet's root-owned directory. Move :latest only once the operator sets
# runAsUser: 0 for the plugin.
#
# Requires the QUAY_USERNAME and QUAY_PASSWORD repository secrets.
name: "Build and push"

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: quay.io/simplyblock-io/numa-resource-plugin

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Compute tag
        id: tag
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to Quay.io
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build and push
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
          build-args: |
            VERSION=${{ steps.tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Red Hat preflight container checks
        run: hack/preflight.sh "${IMAGE}@${{ steps.build.outputs.digest }}"
